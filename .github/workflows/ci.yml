name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          python-version: "3.14"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run mypy src/axial scripts
      - run: uv run pytest -v -n auto

  compat:
    # The floor is 3.13, so prove the package still works there.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
      - run: uv sync --locked --python 3.13
      - run: uv run --python 3.13 pytest -q -n auto

  knowledge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          python-version: "3.14"
      - run: uv sync --locked
      - run: uv run python scripts/knowledge_index.py --check

  package:
    # Users install from a git tag, so build the wheel and run it from outside the
    # checkout: a file the package needs but the wheel leaves out fails here.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
      - run: uv build --wheel
      - name: Run the wheel outside the checkout
        run: |
          cd "$RUNNER_TEMP"
          uv run --isolated --no-project --python 3.13 --with "$GITHUB_WORKSPACE"/dist/*.whl axial --help
