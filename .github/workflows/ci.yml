name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.14"
      - run: uv sync
      - run: uv run ruff check .
      # Every file read or write names its encoding (see [tool.ruff.lint] in pyproject.toml).
      - run: uv run ruff check --preview --select PLW1514 src scripts
      - run: uv run mypy src/axial
      - run: uv run pytest -v

  compat:
    # The floor is 3.13, so prove the package still works there.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --python 3.13
      - run: uv run --python 3.13 pytest -q

  knowledge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.14"
      - run: uv sync
      - run: uv run python scripts/knowledge_index.py --check
