name: release
# Push a tag such as v0.1.0 on a commit in main to publish that version to PyPI as
# axial-evals. The tag must match the version in pyproject.toml. Publishing uses PyPI
# trusted publishing, so the repository holds no token. PyPI must list this workflow
# file and the `pypi` environment as a trusted publisher for axial-evals; the README's
# Releasing section has the one-time setup.
on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          version: "0.11.15"
          python-version: "3.14"
          enable-cache: false
      - name: Check the tag is on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "tag $GITHUB_REF_NAME is on a commit that is not in main"
            exit 1
          fi
      - name: Check the tag matches the package version
        run: |
          version="$(uv version --short)"
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match version $version in pyproject.toml"
            exit 1
          fi
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run mypy src/axial scripts
      - run: uv run pytest -q
      - run: uv build
      # Install the wheel alone, away from the checkout, so a file the package needs
      # but the wheel left out fails here instead of on a user's machine.
      - name: Smoke-test the wheel
        run: |
          cd "$RUNNER_TEMP"
          uv run --isolated --no-project --python 3.13 --with "$GITHUB_WORKSPACE"/dist/*.whl axial --help
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist
          path: dist/

  # Only this job can get a PyPI token, and it installs and runs nothing from the
  # project's dependencies: it uploads the files the build job tested.
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          version: "0.11.15"
          enable-cache: false
          ignore-empty-workdir: true
      - run: uv publish
