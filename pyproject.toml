[project]
name = "axial"
version = "0.1.0"
description = "Error-analysis-first eval toolkit: from traces to a judge you can trust"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.7",
    "typer>=0.12",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "litellm>=1.40",
    "fastapi>=0.111",
    "uvicorn>=0.30",
]

[project.scripts]
axial = "axial.cli:app"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.5", "mypy>=1.10", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/axial"]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.14"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
