[project]
name = "axial-evals"
version = "0.1.0"
description = "Error-analysis-first eval toolkit: from traces to a judge you can trust"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.7",
    "typer>=0.12",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "litellm>=1.40",
    "httpx>=0.27",
    "fastapi>=0.111",
    "uvicorn>=0.30",
]

[project.urls]
Repository = "https://github.com/AndresRubio/ai-evals"

[project.scripts]
axial = "axial.cli:app"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.5", "mypy>=1.10", "httpx>=0.27", "types-PyYAML>=6.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/axial"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# SLF001 keeps Store._read_jsonl, whose rows nothing has checked, inside the store.
# RUF100 flags a noqa that suppresses nothing, such as one for a rule that is not enabled.
extend-select = ["TID251", "SLF001", "RUF100"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"yaml.safe_load".msg = "read YAML through Store.read_yaml, so a bad file is refused in one line naming it"

[tool.ruff.lint.per-file-ignores]
"src/axial/store.py" = ["TID251"]
# The ban is about .axial/ state; these read their own files directly.
"scripts/**" = ["TID251"]
"tests/**" = ["TID251", "SLF001"]

[tool.mypy]
python_version = "3.14"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# An xfail whose test starts passing fails the run, so a fixed defect or a changed
# design question gets looked at.
xfail_strict = true
