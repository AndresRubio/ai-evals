[project]
name = "axial-evals"
version = "0.1.0"
description = "Error-analysis-first eval toolkit: from traces to a judge you can trust"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.7",
    "typer>=0.12",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "litellm>=1.40",
    "httpx>=0.27",
    "fastapi>=0.111",
    "uvicorn>=0.30",
]

[project.urls]
Repository = "https://github.com/AndresRubio/ai-evals"

[project.scripts]
axial = "axial.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "httpx>=0.27",
    "types-PyYAML>=6.0",
    "pytest-xdist>=3.6",
    "import-linter>=2.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/axial"]

# The sdist otherwise ships every tracked file, internal plans and agent notes included.
[tool.hatch.build.targets.sdist]
exclude = ["docs/", ".github/", "CLAUDE.md"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# SLF001 keeps Store._read_jsonl, whose rows nothing has checked, inside the store.
# RUF100 flags a noqa that suppresses nothing, such as one for a rule that is not enabled.
extend-select = ["TID251", "SLF001", "RUF100"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"yaml.safe_load".msg = "read YAML through Store.read_yaml, so a bad file is refused in one line naming it"

[tool.ruff.lint.per-file-ignores]
"src/axial/core/store.py" = ["TID251"]
# The ban is about .axial/ state; these read their own files directly.
"scripts/**" = ["TID251"]
"tests/**" = ["TID251", "SLF001"]

[tool.mypy]
python_version = "3.14"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# An xfail whose test starts passing fails the run, so a fixed defect or a changed
# design question gets looked at.
xfail_strict = true

# The packages follow the method: shared plumbing, statistics, error analysis, judge
# development, production measurement. Each imports only the packages below it, and inside
# a package each module imports only the rows below its own; two modules in one row never
# import each other. A new import upward is a design change, and the row it breaks says
# which seam it crosses. Every module has a row, so a new file is placed before it can
# import anything.
[tool.importlinter]
root_package = "axial"

[[tool.importlinter.contracts]]
name = "the packages are layered"
type = "layers"
containers = ["axial"]
exhaustive = true
layers = ["cli", "monitor", "judge", "analysis", "stats", "core", "errors"]

[[tool.importlinter.contracts]]
name = "monitor is layered"
type = "layers"
containers = ["axial.monitor"]
exhaustive = true
layers = ["gate", "pairing", "measure"]

[[tool.importlinter.contracts]]
name = "judge is layered"
type = "layers"
containers = ["axial.judge"]
exhaustive = true
layers = ["threshold | alignment", "promotion | checks", "run", "spec"]

[[tool.importlinter.contracts]]
name = "analysis is layered"
type = "layers"
containers = ["axial.analysis"]
exhaustive = true
layers = ["annotate", "dataset | taxonomy", "sample"]

[[tool.importlinter.contracts]]
name = "stats is layered"
type = "layers"
containers = ["axial.stats"]
exhaustive = true
layers = ["corrected", "align | perplexity"]

[[tool.importlinter.contracts]]
name = "core is layered"
type = "layers"
containers = ["axial.core"]
exhaustive = true
layers = ["reviews", "config | model", "store", "traces"]

# The three rules below are ones the package order alone would let through.

# annotate is a FastAPI front end. Only the cli starts it.
[[tool.importlinter.contracts]]
name = "only the cli imports the annotate app"
type = "forbidden"
source_modules = ["axial.monitor", "axial.judge"]
forbidden_modules = ["axial.analysis.annotate"]

# Measuring a batch and pairing two of them depend on a promoted judge. How its alignment
# is reported and how its threshold was tuned are no part of either.
[[tool.importlinter.contracts]]
name = "measure and pairing import neither the alignment report nor threshold tuning"
type = "forbidden"
source_modules = ["axial.monitor.measure", "axial.monitor.pairing"]
forbidden_modules = ["axial.judge.alignment", "axial.judge.threshold"]

# The statistics are arithmetic on counts and scores, so they can be checked without a
# .axial tree or a model. A Trace, which perplexity reads, is all they take from core.
[[tool.importlinter.contracts]]
name = "stats takes only traces from core"
type = "forbidden"
source_modules = ["axial.stats"]
forbidden_modules = ["axial.core"]
ignore_imports = ["axial.stats.* -> axial.core.traces"]
